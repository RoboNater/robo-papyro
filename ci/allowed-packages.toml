# Every third-party package permitted in uv.lock, with the license it ships
# under. The CI license gate fails the build on anything not listed here, so
# adding a dependency is a deliberate, reviewable act.
#
# Adding an entry means asserting you checked the license. Permissive only:
# see docs/specs/robo-papyro-spec.md §7. Copyleft in the dependency graph is a
# blocker in this environment, not a preference.
#
# Workspace members (rp-core, rp-pdf, rp-docx, robo-papyro) are allowed
# automatically and do not need listing.

[direct]
# Named in the spec's approved list.
pdf2image = "MIT"
pdfplumber = "MIT"
pillow = "MIT-CMU"
pydantic = "MIT"
pypdf = "BSD-3-Clause"
typer = "MIT"

# Phase 1 (rp-docx) will add these; pre-approved by the spec.
lxml = "BSD-3-Clause"
mammoth = "BSD-2-Clause"
python-docx = "MIT"

# Phase 3 (rp-xlsx / rp-pptx); pre-approved by the spec.
openpyxl = "MIT"
python-pptx = "MIT"

[dev]
coverage = "Apache-2.0"
iniconfig = "MIT"
packaging = "Apache-2.0 OR BSD-2-Clause"
pluggy = "MIT"
pytest = "MIT"
pytest-cov = "MIT"
reportlab = "BSD-3-Clause"
ruff = "MIT"
tomli = "MIT"

[optional]
# The `ai` extra: the VLM review pass.
#
# This extra is also the only route by which any weak-copyleft package enters
# the graph — see the note above [transitive]. A base `uv pip install rp-pdf`
# resolves to 24 distributions, all fully permissive.
openai = "Apache-2.0"

# Two entries below are MPL-2.0 — weak, file-level copyleft rather than fully
# permissive, and not on the spec's §7 approved list. Both are marked
# `# ai-extra`, because both enter only through the optional `ai` extra
# (openai → httpx → certifi, openai → tqdm). A base install of rp-core + rp-pdf
# contains neither, so the default install is fully permissive and the blast
# radius of a compliance objection is the VLM review pass, not the toolkit.
# MPL-2.0 is the license §7 already accepts for LibreOffice.
[transitive]
annotated-doc = "MIT"
annotated-types = "MIT"
anyio = "MIT"
certifi = "MPL-2.0"          # ai-extra; weak file-level copyleft, a CA-bundle data package
cffi = "MIT-0"
charset-normalizer = "MIT"
colorama = "BSD-3-Clause"
cryptography = "Apache-2.0 OR BSD-3-Clause"
distro = "Apache-2.0"
h11 = "MIT"
httpcore = "BSD-3-Clause"
httpx = "BSD-3-Clause"
idna = "BSD-3-Clause"
jiter = "MIT"
markdown-it-py = "MIT"
mdurl = "MIT"
pdfminer-six = "MIT"
pycparser = "BSD-3-Clause"
pydantic-core = "MIT"
pygments = "BSD-2-Clause"
pypdfium2 = "BSD-3-Clause OR Apache-2.0"
rich = "MIT"
shellingham = "ISC"
sniffio = "MIT OR Apache-2.0"
tqdm = "MPL-2.0 AND MIT"     # ai-extra; weak file-level copyleft
typing-extensions = "PSF-2.0"
typing-inspection = "MIT"
