# robo-papyro workspace root. No code lives here — every distribution is a
# member under packages/. Shared dev dependencies and shared tool config are
# declared here; each member declares its own runtime dependencies explicitly.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "openai>=1.60.0",
    "pytest>=8",
    "pytest-cov",
    "reportlab>=5.0.0",
    # Pinned exactly, not floored. ruff's implicit default rule set widens
    # between releases, so a floor means the lint gate quietly changes what it
    # enforces on whichever day a new ruff lands — that was the root cause of
    # the Phase 0 workaround. Bump this deliberately, in its own commit.
    "ruff==0.16.1",
]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

# Stated explicitly rather than inherited, so the gate does not move when ruff
# does. E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade, B bugbear.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
# "ci" holds the license gate and its tests — workspace infrastructure rather
# than any one package's code.
testpaths = ["packages/*/tests", "ci"]

# Workspace invariant 3 (spec section 10). Under pytest's default "prepend"
# import mode, two packages with same-named test modules collide, because each
# tests/ directory is pushed onto sys.path and the first `test_render` wins.
# Enforced by ci/test_workspace_invariants.py; do not change without reading it.
#
# Spec section 3 shows this as an ini key, `importmode = "importlib"`. There is
# no such ini key — pytest registers --import-mode as a command-line option
# only, so the key is silently ignored with a PytestConfigWarning and the
# collision comes back. addopts is the working spelling.
addopts = ["--import-mode=importlib"]

# The license gate is a plain module sitting next to its test, and importlib
# mode does not put its directory on sys.path. This is the only entry that
# needs to be here: package code is imported from the installed distributions,
# and test modules no longer import each other.
pythonpath = ["ci"]

markers = [
    "requires_poppler: needs pdftoppm/pdftotext on PATH; skipped when absent",
]
