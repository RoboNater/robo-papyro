# robo-papyro workspace root. No code lives here — every distribution is a
# member under packages/. Shared dev dependencies and shared tool config are
# declared here; each member declares its own runtime dependencies explicitly.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "openai>=1.60.0",
    "pytest>=8",
    "pytest-cov",
    "reportlab>=5.0.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
