# robo-papyro workspace root. No code lives here — every distribution is a
# member under packages/. Shared dev dependencies and shared tool config are
# declared here; each member declares its own runtime dependencies explicitly.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "openai>=1.60.0",
    "pytest>=8",
    "pytest-cov",
    "reportlab>=5.0.0",
    # Pinned exactly, not floored. ruff's implicit default rule set widens
    # between releases, so a floor means the lint gate quietly changes what it
    # enforces on whichever day a new ruff lands — that was the root cause of
    # the Phase 0 workaround. Bump this deliberately, in its own commit.
    "ruff==0.16.1",
]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

# Stated explicitly rather than inherited, so the gate does not move when ruff
# does. E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade, B bugbear.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
# "ci" holds the license gate and its tests — workspace infrastructure rather
# than any one package's code.
testpaths = ["packages/*/tests", "ci"]
