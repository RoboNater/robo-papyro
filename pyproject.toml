# robo-papyro workspace root. No code lives here — every distribution is a
# member under packages/. Shared dev dependencies and shared tool config are
# declared here; each member declares its own runtime dependencies explicitly.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "openai>=1.60.0",
    "pytest>=8",
    "pytest-cov",
    "reportlab>=5.0.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

# Pinned explicitly rather than inherited. The pdfx code was written against
# ruff's classic default rule set; newer ruff releases widened the implicit
# default, which flags ~65 pre-existing style findings across the tree. Pinning
# keeps the CI ruff gate meaningful without rewriting code during a refactor.
# Widening this set is a deliberate follow-up, not Phase 0 work.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# "ci" holds the license gate and its tests — workspace infrastructure rather
# than any one package's code.
testpaths = ["packages/*/tests", "ci"]
