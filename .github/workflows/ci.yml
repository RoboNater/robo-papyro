name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail rather than silently resolving something the lockfile does not pin.
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check packages ci
      - name: ruff format --check
        run: uv run ruff format --check packages ci
      # The license gate's own tests: the gate must be shown to fail on the
      # things it claims to catch, not merely to pass today.
      - name: Test the license gate
        run: uv run pytest ci -rs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rp-core, rp-pdf, rp-docx, rp-pptx, rp-xlsx, rp-mcp, robo-papyro]
        python-version: ["3.11", "3.13"]
    name: test ${{ matrix.package }} (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      # poppler backs rp-pdf's default text engine and all rendering. Without
      # it those tests skip, and a skipped test proves nothing.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-extras

      # Console scripts must be on PATH: rp-pdf and robo-papyro both have tests
      # that drive the installed entry points through subprocess.
      # -rs reports the reason for any skip, so a silently-skipped suite is
      # visible in the log rather than passing as a green tick.
      - name: Run tests
        run: uv run pytest packages/${{ matrix.package }}/tests -rs

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stdlib only, by design: the gate reads uv.lock as data and must run
      # even when the environment cannot be built.
      - name: Check every locked package against the approved list
        run: python3 ci/license_gate.py

  # The definition of done from robo-papyro-spec.md §8: a clean checkout syncs,
  # and every CLI the suite advertises actually runs.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: CLIs respond
        run: |
          uv run rp --help
          uv run rp doctor
          uv run rp pdf --help
          uv run rp-pdf --help
          uv run rp-pdf doctor
          uv run rp docx --help
          uv run rp-docx --help
          uv run rp-docx doctor
          uv run rp pptx --help
          uv run rp-pptx --help
          uv run rp-pptx doctor
          uv run rp xlsx --help
          uv run rp-xlsx --help
          uv run rp-xlsx doctor
          uv run rp mcp --help
          uv run rp-mcp --help
          uv run rp-mcp doctor
          uv run rp-pdf-mcp --help
          uv run rp-docx-mcp --help
          uv run rp-pptx-mcp --help
          uv run rp-xlsx-mcp --help
      - name: rp pdf and rp-pdf are the same code path
        run: |
          uv run --with reportlab python -c "
          from reportlab.pdfgen import canvas
          c = canvas.Canvas('sample.pdf'); c.drawString(72, 720, 'Page 1'); c.save()"
          uv run rp pdf index sample.pdf > through-umbrella.json
          uv run rp-pdf index sample.pdf > direct.json
          diff through-umbrella.json direct.json
      # The same assertion for the second leaf. `rp <name>` gets whatever the
      # leaf registered as its typer app, so this is what proves entry-point
      # discovery still reaches it — a broken registration otherwise shows up
      # only as a missing subcommand nobody notices.
      - name: rp docx and rp-docx are the same code path
        run: |
          printf '# Title\n\nBody paragraph.\n' > notes.md
          uv run rp-docx create -o sample.docx --from-markdown notes.md
          uv run rp docx index sample.docx > docx-umbrella.json
          uv run rp-docx index sample.docx > docx-direct.json
          diff docx-umbrella.json docx-direct.json
      # No external binary is needed for any read or write path (spec §10), so
      # the whole rp-docx round trip must work on a machine with neither
      # LibreOffice nor poppler installed. This job has poppler but no
      # LibreOffice, which is the interesting half.
      - name: rp-docx needs no external binary to read or write
        run: |
          uv run rp-docx replace sample.docx --map '{"Body":"Edited"}' -o edited.docx
          uv run rp-docx text edited.docx --plain
          uv run rp-docx markdown edited.docx
          uv run rp-docx templates manifest sample.docx -o sample.manifest.json
          uv run rp-docx templates synthesize sample.manifest.json -o rebuilt.dotx
          uv run rp-docx index rebuilt.dotx > /dev/null
      # The third leaf. Same assertion, same reason: entry-point discovery
      # breaking shows up only as a subcommand nobody notices is missing.
      - name: rp pptx and rp-pptx are the same code path
        run: |
          printf '# Deck Title\n\nOpening line.\n\n## Content\n\n- first\n  - nested\n' > slides.md
          uv run rp-pptx create -o sample.pptx --from-markdown slides.md
          uv run rp pptx index sample.pptx > pptx-umbrella.json
          uv run rp-pptx index sample.pptx > pptx-direct.json
          diff pptx-umbrella.json pptx-direct.json
      # As for rp-docx: no external binary is needed for any read or write path,
      # so the whole round trip must work on a machine with no LibreOffice. The
      # manifest/synthesize pair is the interesting part — it is what lets CI
      # exercise a house template's shape without the template (spec section 5.2).
      - name: rp-pptx needs no external binary to read or write
        run: |
          uv run rp-pptx replace sample.pptx --map '{"first":"edited"}' -o edited.pptx
          uv run rp-pptx text edited.pptx --plain
          uv run rp-pptx markdown edited.pptx
          uv run rp-pptx tables sample.pptx
          uv run rp-pptx notes sample.pptx
          uv run rp-pptx slides reorder sample.pptx --order 2,1 -o reordered.pptx
          uv run rp-pptx slides delete reordered.pptx --slides 2 -o trimmed.pptx
          uv run rp-pptx templates manifest sample.pptx -o sample.manifest.json
          uv run rp-pptx templates synthesize sample.manifest.json -o rebuilt.potx
          uv run rp-pptx index rebuilt.potx > /dev/null
      # The fourth leaf. Same assertion, same reason.
      - name: rp xlsx and rp-xlsx are the same code path
        run: |
          printf 'A,B\n1,2\n3,4\n' > table.csv
          uv run rp-xlsx create -o sample.xlsx --from-csv table.csv
          uv run rp xlsx index sample.xlsx > xlsx-umbrella.json
          uv run rp-xlsx index sample.xlsx > xlsx-direct.json
          diff xlsx-umbrella.json xlsx-direct.json
      # As for rp-docx and rp-pptx: no external binary is needed for any read or
      # write path, so the whole round trip must work on a machine with no
      # LibreOffice. The manifest/synthesize pair is the interesting part — it
      # is what lets CI exercise a house template's shape without the template
      # (spec section 5.2).
      - name: rp-xlsx needs no external binary to read or write
        run: |
          uv run rp-xlsx set sample.xlsx --map '{"table": {"A2": 99}}' -o edited.xlsx
          uv run rp-xlsx data edited.xlsx --plain
          uv run rp-xlsx markdown edited.xlsx
          uv run rp-xlsx cells sample.xlsx
          uv run rp-xlsx fidelity sample.xlsx
          uv run rp-xlsx sheets add sample.xlsx --name Extra -o added.xlsx
          uv run rp-xlsx sheets reorder added.xlsx --order 2,1 -o reordered.xlsx
          uv run rp-xlsx sheets delete reordered.xlsx --sheet Extra -o trimmed.xlsx
          uv run rp-xlsx templates manifest sample.xlsx -o sample.manifest.json
          uv run rp-xlsx templates synthesize sample.manifest.json -o rebuilt.xltx
          uv run rp-xlsx index rebuilt.xltx > /dev/null
      - name: Exit codes are the suite's, not a flat 1
        run: |
          expect() {
            local want=$1; shift
            local got=0
            "$@" > /dev/null 2>&1 || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          echo "not a pdf" > fake.pdf
          expect 3 uv run rp-pdf index fake.pdf
          expect 1 uv run rp-pdf text sample.pdf --pages 99
          expect 0 uv run rp-pdf index sample.pdf
          # Both leaves report the same taxonomy, which is the point of it.
          echo "not a docx" > fake.docx
          expect 3 uv run rp-docx index fake.docx
          expect 1 uv run rp-docx index missing.docx
          expect 1 uv run rp-docx create -o x.docx --template nonexistent
          expect 0 uv run rp-docx index sample.docx
          # And the third. A taxonomy only two leaves honour is not a taxonomy.
          echo "not a pptx" > fake.pptx
          expect 3 uv run rp-pptx index fake.pptx
          expect 1 uv run rp-pptx index missing.pptx
          expect 1 uv run rp-pptx text sample.pptx --slides 99
          expect 1 uv run rp-pptx create -o x.pptx --template nonexistent
          expect 1 uv run rp-pptx replace sample.pptx --map '{}'
          expect 0 uv run rp-pptx index sample.pptx
          # The fourth leaf. Same taxonomy, plus rp-xlsx's own exit-3 case:
          # section 6's fidelity guard, which the other three leaves don't have.
          echo "not an xlsx" > fake.xlsx
          expect 3 uv run rp-xlsx index fake.xlsx
          expect 1 uv run rp-xlsx index missing.xlsx
          expect 1 uv run rp-xlsx data sample.xlsx --sheets 99
          expect 1 uv run rp-xlsx create -o x.xlsx --template nonexistent
          expect 0 uv run rp-xlsx index sample.xlsx
          uv run python -c "
          import zipfile
          with zipfile.ZipFile('sample.xlsx') as zin, zipfile.ZipFile('at-risk.xlsx', 'w') as zout:
              for item in zin.infolist():
                  zout.writestr(item, zin.read(item.filename))
              zout.writestr('xl/threadedComments/threadedComment1.xml', '<threadedComments/>')
          "
          expect 3 uv run rp-xlsx set at-risk.xlsx --map '{"table": {"A2": 1}}' -o loss.xlsx
          expect 0 uv run rp-xlsx set at-risk.xlsx --map '{"table": {"A2": 1}}' -o loss.xlsx --allow-lossy
      # rp-mcp's servers are what an agent actually talks to, and a broken
      # registration is invisible until a client connects. `tools` builds the
      # real server and lists it without serving, so the smoke job can assert
      # the surface — including that the write tools appear only with a write
      # root, which is the sandbox's central promise.
      - name: rp-mcp exposes the tools it advertises
        run: |
          uv run rp-mcp tools --server pdf --root . > mcp-read.json
          uv run rp-mcp tools --server docx --root . --write-root ./out > mcp-write.json
          uv run rp-mcp tools --server xlsx --root . --write-root ./out > mcp-xlsx-write.json
          uv run python -c "
          import json
          read = {t['name'] for t in json.load(open('mcp-read.json'))['tools']}
          write = {t['name'] for t in json.load(open('mcp-write.json'))['tools']}
          xlsx_write = {t['name'] for t in json.load(open('mcp-xlsx-write.json'))['tools']}
          assert 'pdf_index' in read, sorted(read)
          assert 'rp_sandbox' in read, sorted(read)
          assert 'docx_create' in write, sorted(write)
          assert 'xlsx_create' in xlsx_write, sorted(xlsx_write)
          assert not json.load(open('mcp-read.json'))['sandbox']['writable']
          print('mcp surface ok:', len(read), 'read tools,', len(write), 'docx tools,', len(xlsx_write), 'xlsx tools')"
      - name: Errors are ErrorEnvelopes on stderr, results on stdout
        run: |
          uv run rp-pdf index missing.pdf > out.txt 2> err.txt || true
          if [ -s out.txt ]; then
            echo "::error::stdout was not empty on a failed run"; exit 1
          fi
          tail -n 1 err.txt | uv run python -c "
          import json, sys
          detail = json.load(sys.stdin)['error']
          assert sorted(detail) == ['exit_code', 'hint', 'message', 'type'], detail
          assert detail['exit_code'] == 1, detail
          print('envelope ok:', detail['type'])"
          uv run rp-docx index missing.docx > docx-out.txt 2> docx-err.txt || true
          if [ -s docx-out.txt ]; then
            echo "::error::rp-docx stdout was not empty on a failed run"; exit 1
          fi
          tail -n 1 docx-err.txt | uv run python -c "
          import json, sys
          detail = json.load(sys.stdin)['error']
          assert sorted(detail) == ['exit_code', 'hint', 'message', 'type'], detail
          assert detail['type'] == 'MissingFileError', detail
          print('envelope ok:', detail['type'])"
