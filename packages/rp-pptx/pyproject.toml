[project]
name = "rp-pptx"
version = "0.1.0"
description = "JSON-first PowerPoint document toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "pillow>=10", "pydantic>=2.13.4", "python-pptx>=1.0.2", "rp-core", "typer>=0.26.8"]

[project.scripts]
rp-pptx = "rp_pptx.cli:app"

[project.entry-points."robo_papyro.commands"]
pptx = "rp_pptx.cli:app"

[tool.uv.sources]
rp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_pptx"]
