[project]
name = "rp-xlsx"
version = "0.1.0"
description = "JSON-first spreadsheet toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "openpyxl>=3.1.5", "pillow>=10", "pydantic>=2.13.4", "rp-core", "typer>=0.26.8"]

[project.scripts]
rp-xlsx = "rp_xlsx.cli:app"

[project.entry-points."robo_papyro.commands"]
xlsx = "rp_xlsx.cli:app"

[tool.uv.sources]
rp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_xlsx"]
