[project]
name = "robo-papyro"
version = "0.1.0"
description = "Umbrella distribution and `rp` dispatcher for the robo-papyro document toolkit suite"
readme = "README.md"
requires-python = ">=3.11"
# The meta-distribution installs the leaves; the CLI discovers them through the
# robo_papyro.commands entry-point group rather than importing them.
#
# `rp-mcp` is a runtime dependency, not an extra: the suite is built for agentic
# document work, and an agent integration you have to know to ask for is one
# most users never find. `rp mcp` is therefore always present in a published
# install. It shipped as an extra in Phase 2 and was made unconditional
# afterwards — see docs/specs/robo-papyro-spec.md §6.
#
# The cost is measured and accepted: this takes a published install from 34
# packages to 56, including an ASGI stack (starlette, uvicorn, sse-starlette)
# that someone running only `rp pdf index` will never execute. All pure Python,
# and installing a server is not running one — stdio is the only transport
# rp-mcp offers, and nothing starts it implicitly.
#
# This is a packaging choice, not a licensing one: ci/license_gate.py computes
# the base install path from every workspace member, so the MCP tree is in it
# either way (docs/specs/rp-mcp-spec.md §2). What keeps §7.1 satisfied is
# rp-mcp's `mcp>=2.0.0,<3` pin, which this dependency now puts in front of every
# `robo-papyro` user; .github/dependabot.yml exists so the cap cannot go stale
# unnoticed.
dependencies = [
    "rp-core",
    "rp-docx",
    "rp-mcp",
    "rp-pdf",
    "rp-pptx",
    "typer>=0.26.8",
]

[project.scripts]
rp = "robo_papyro.cli:main"

[tool.uv.sources]
rp-core = { workspace = true }
rp-docx = { workspace = true }
rp-mcp = { workspace = true }
rp-pdf = { workspace = true }
rp-pptx = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_papyro"]
