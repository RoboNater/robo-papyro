[project]
name = "robo-papyro"
version = "0.1.0"
description = "Umbrella distribution and `rp` dispatcher for the robo-papyro document toolkit suite"
readme = "README.md"
requires-python = ">=3.11"
# The meta-distribution installs the leaves; the CLI discovers them through the
# robo_papyro.commands entry-point group rather than importing them.
dependencies = [
    "rp-core",
    "rp-docx",
    "rp-pdf",
    "rp-pptx",
    "typer>=0.26.8",
]

# `rp-mcp` is an extra, not a runtime dependency, so a plain `pip install
# robo-papyro` still gets a document toolkit and none of the MCP SDK. `rp mcp`
# then appears exactly when rp-mcp is installed — by this extra or on its own —
# because the umbrella discovers subcommands through entry points and degrades
# when one is absent.
#
# This is a packaging choice, not a licensing one: ci/license_gate.py computes
# the base install path from every workspace member, so the MCP tree is in it
# either way (docs/specs/rp-mcp-spec.md §2).
[project.optional-dependencies]
mcp = ["rp-mcp"]

[project.scripts]
rp = "robo_papyro.cli:main"

[tool.uv.sources]
rp-core = { workspace = true }
rp-docx = { workspace = true }
rp-mcp = { workspace = true }
rp-pdf = { workspace = true }
rp-pptx = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_papyro"]
