[project]
name = "rp-pdf"
version = "0.4.0"
description = "PDF extraction toolkit: JSON-first library and CLI for text, tables, images, and page rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "typer>=0.26.8",
]

[project.optional-dependencies]
ai = [
    "openai>=1.60.0",
]

# The console script points at cli:main, not cli:app — main() rewrites sys.argv
# to inject the config's [default].command, which is what makes `rp-pdf FILE.pdf`
# work. The umbrella entry point below gets the bare typer app instead.
[project.scripts]
rp-pdf = "rp_pdf.cli:main"

[project.entry-points."robo_papyro.commands"]
pdf = "rp_pdf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp_pdf"]
